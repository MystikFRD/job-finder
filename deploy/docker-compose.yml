services:
  job-finder-web:
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - supabase

networks:
  supabase:
    external: true
    name: supabase_default
